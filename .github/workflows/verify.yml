# Verificação automatizada (ADR-0023 §14).
#
# Executa o MESMO comando definido em package.json (`pnpm verify`), sem duplicar a
# definição (ADR-0023 §9). Serviços nas mesmas versões do docker-compose.yml (§15).
#
# A barreira efetiva é a proteção de ramificação exigindo este workflow aprovado
# como condição de incorporação (ADR-0023 §17). Sem ela, este arquivo apenas informa.

name: Verificação

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verificar
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_USER: vince
          POSTGRES_PASSWORD: vince
          POSTGRES_DB: vince
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vince -d vince"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # A aplicação recusa subir sem configuração, e a mensagem nomeia a variável que
    # falta — o teste de contrato de API monta a aplicação inteira, então o runner
    # precisa das mesmas variáveis que `.env.example` declara.
    #
    # Os valores abaixo são de teste, e é por isso que podem ser versionados: nenhum
    # é segredo real. `CSRF_TOKEN_SECRET` é o único que em produção NÃO DEVE nascer
    # daqui — lá ele vem do cofre de segredos do ambiente.
    env:
      DATABASE_URL: postgresql://vince:vince@localhost:5432/vince
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: http://localhost:5173

      SESSION_COOKIE_NAME: vince_session
      SESSION_IDLE_TTL_SECONDS: 28800
      SESSION_ABSOLUTE_TTL_SECONDS: 604800

      CSRF_TOKEN_SECRET: segredo-de-verificacao-sem-valor-em-producao
      CSRF_COOKIE_NAME: vince_csrf

      # Custo reduzido: o que a verificação exercita é a regra da credencial, não o
      # custo do algoritmo, e os parâmetros de produção fariam cada asserção de senha
      # custar dezenas de milissegundos sem verificar mais nada.
      PASSWORD_HASH_MEMORY_KIB: 8192
      PASSWORD_HASH_TIME_COST: 1
      PASSWORD_HASH_PARALLELISM: 1

      PASSWORD_RESET_TTL_SECONDS: 3600

    steps:
      # Sem o submódulo: nada em `verify` lê docs/, que está fora do tsconfig,
      # do ESLint e do Prettier. Buscá-lo só acrescentaria tempo a cada execução.
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar cliente Prisma
        run: pnpm run db:generate

      - name: Aplicar migrações
        run: pnpm run db:deploy

      - name: Verificar
        run: pnpm run verify
